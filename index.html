<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Castro Personalizados - Cardápio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

  <!-- Cabeçalho da Loja -->
  <header class="bg-white shadow-sm border-b sticky top-0 z-20">
    <div class="max-w-3xl mx-auto p-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img id="store-logo" src="https://via.placeholder.com/60" alt="Logo" class="w-12 h-12 rounded-full object-cover border" />
        <div>
          <h1 id="store-name" class="font-bold text-xl text-gray-900">Castro Personalizados</h1>
          <p id="store-sub" class="text-xs text-gray-500">Seja bem-vindo!</p>
        </div>
      </div>
      <button id="btn-open-login" onclick="toggleModal('modal-login')" class="text-xs font-semibold px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-md">
        Área Admin
      </button>
    </div>
  </header>

  <!-- Painel Administrativo -->
  <section id="admin-panel" class="hidden bg-amber-50 border-b border-amber-200 p-4 max-w-3xl mx-auto my-4 rounded-xl shadow-inner">
    <div class="flex justify-between items-center mb-3">
      <h2 class="font-bold text-amber-900 text-lg">⚙️ Painel de Edição (Admin)</h2>
      <button onclick="logoutAdmin()" class="text-xs bg-red-600 text-white px-3 py-1 rounded-md">Sair</button>
    </div>

    <!-- Editar Informações da Loja -->
    <div class="space-y-2 mb-4 bg-white p-3 rounded-lg border">
      <h3 class="text-sm font-semibold text-gray-700">Dados da Loja</h3>
      <input type="text" id="input-store-name" placeholder="Nome da Loja" class="w-full text-sm border p-2 rounded" />
      <input type="file" id="input-store-logo" accept="image/*" class="w-full text-xs border p-2 rounded" />
      <button onclick="saveStoreInfo()" class="bg-green-600 text-white text-xs px-3 py-2 rounded font-semibold">Atualizar Loja</button>
    </div>

    <!-- Adicionar Novo Produto -->
    <div class="space-y-2 bg-white p-3 rounded-lg border">
      <h3 class="text-sm font-semibold text-gray-700">Cadastrar Item</h3>
      <input type="text" id="input-prod-title" placeholder="Nome do Produto" class="w-full text-sm border p-2 rounded" />
      <input type="number" step="0.01" id="input-prod-price" placeholder="Preço (Ex: 25.50)" class="w-full text-sm border p-2 rounded" />
      <input type="file" id="input-prod-img" accept="image/*" class="w-full text-xs border p-2 rounded" />
      <button onclick="addProduct()" class="bg-amber-600 text-white text-xs px-3 py-2 rounded font-semibold">Salvar Produto</button>
    </div>
  </section>

  <!-- Lista de Produtos -->
  <main class="max-w-3xl mx-auto p-4">
    <h2 class="font-bold text-lg mb-4 text-gray-700">Cardápio</h2>
    <div id="products-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Inserido dinamicamente via JS -->
    </div>
  </main>

  <!-- Barra Flutuante do Carrinho -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 shadow-lg z-30">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div>
        <p class="text-xs text-gray-500">Total do Pedido</p>
        <p id="cart-total" class="text-lg font-bold text-green-600">R$ 0,00</p>
      </div>
      <button onclick="checkoutWhatsApp()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-5 py-2.5 rounded-lg text-sm shadow transition">
        Finalizar no WhatsApp
      </button>
    </div>
  </footer>

  <!-- Modal Login Admin -->
  <div id="modal-login" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-xl w-full max-w-sm space-y-4">
      <h3 class="font-bold text-lg">Login do Administrador</h3>
      <input type="email" id="login-email" placeholder="E-mail" class="w-full text-sm border p-2 rounded" />
      <input type="password" id="login-pass" placeholder="Senha" class="w-full text-sm border p-2 rounded" />
      <div class="flex justify-end space-x-2">
        <button onclick="toggleModal('modal-login')" class="px-3 py-1.5 text-xs text-gray-600">Cancelar</button>
        <button onclick="loginAdmin()" class="px-4 py-1.5 text-xs bg-amber-600 text-white font-semibold rounded">Entrar</button>
      </div>
    </div>
  </div>

<!-- Scripts do Firebase Compatibility -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- Script principal -->
<script src="app.js"></script>
</body>
</html>
